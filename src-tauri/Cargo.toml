[package]
name = "kestrel-bay"
version = "0.1.0"
description = "Kestrel Bay"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kestrel_bay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "flac", "mp3", "mp4", "symphonia-alac", "vorbis"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "query"] }
md5 = "0.8"
psysonic-library = { git = "https://github.com/Psysonic/psysonic", rev = "0549992e13c7d165ca3ea5801e5cfba96feedc92" }
psysonic-core = { git = "https://github.com/Psysonic/psysonic", rev = "0549992e13c7d165ca3ea5801e5cfba96feedc92" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSValue", "NSDictionary", "NSData"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "UIImage", "UIApplication", "UIResponder", "UIDevice"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "MPMediaEntity", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
