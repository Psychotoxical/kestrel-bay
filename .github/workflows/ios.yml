name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = compile this branch for iOS; testflight = build the app and upload it; crashlogs = fetch TestFlight crash reports"
        type: choice
        options: [check, testflight, crashlogs]
        default: check

concurrency:
  group: psysonic-ios-${{ inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    if: inputs.mode == 'check'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Placeholder frontend
        run: |
          mkdir -p dist
          echo '<!doctype html><title>check</title>' > dist/index.html

      - name: cargo check for iOS
        working-directory: src-tauri
        run: |
          set +e
          # Debug and release both: Psysonic has code that only exists without debug_assertions.
          cargo check --workspace --target aarch64-apple-ios --keep-going --message-format short 2>&1 | tee "$GITHUB_WORKSPACE/ios-check.log"
          dev=${PIPESTATUS[0]}
          cargo check --release --workspace --target aarch64-apple-ios --keep-going --message-format short 2>&1 | tee -a "$GITHUB_WORKSPACE/ios-check.log"
          release=${PIPESTATUS[0]}
          echo "cargo exit code: dev=$dev release=$release" | tee -a "$GITHUB_WORKSPACE/ios-check.log"

      - name: Summary
        run: |
          log=ios-check.log
          {
            echo "## psysonic-ios on aarch64-apple-ios"
            echo
            tail -n 1 "$log"
            echo
            echo "### Errors"
            grep -E "^[^ ]+\.rs:[0-9]+:[0-9]+: error" "$log" || true
            echo
            echo "### Warnings per file"
            grep -E "^[^ ]+\.rs:[0-9]+:[0-9]+: warning" "$log" | cut -d: -f1 | sort | uniq -c | sort -rn || true
            echo
            echo "### Crates that could not compile"
            grep -E "could not compile" "$log" | sort -u || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: psysonic-ios-check-log
          path: ios-check.log

  testflight:
    if: inputs.mode == 'testflight'
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check secrets
        run: |
          for name in APPLE_DEVELOPMENT_TEAM APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is missing"; exit 1; fi
          done

      - name: Write App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "::error::Secret APPLE_API_KEY_P8 is missing"; exit 1; fi
          mkdir -p ~/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - run: xcodebuild -version

      - run: npm ci

      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - run: npx tauri ios init --ci

      - name: Show linked SDK frameworks
        run: grep -n "sdk:" src-tauri/gen/apple/project.yml

      - run: npx tauri icon src-tauri/icons/ios-app-icon.png

      - name: Build iOS app
        env:
          # Touch shell; TAURI_ENV_PLATFORM=ios selects it too, this keeps it explicit.
          PSY_MOBILE_SHELL: '1'
        run: npx tauri ios build --ci --export-method app-store-connect --build-number ${{ github.run_number }}

      - name: Upload to TestFlight
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ]; then echo "::error::No IPA found"; exit 1; fi
          echo "Uploading $ipa"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  crashlogs:
    if: inputs.mode == 'crashlogs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch TestFlight crash reports
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          BUNDLE_ID: com.kestrelbay.lab
        run: |
          cat > fetch.mjs <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const { APPLE_API_ISSUER: iss, APPLE_API_KEY: kid, APPLE_API_KEY_P8: p8, BUNDLE_ID } = process.env;
          const b64 = (v) => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64({ alg: 'ES256', kid, typ: 'JWT' })}.${b64({ iss, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' })}`;
          const signature = crypto.sign('sha256', Buffer.from(unsigned), { key: p8, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${unsigned}.${signature}`;

          const api = async (path) => {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status} ${await response.text()}`);
            return response.json();
          };

          const apps = await api(`/v1/apps?filter[bundleId]=${BUNDLE_ID}`);
          if (!apps.data.length) throw new Error(`no app with bundle id ${BUNDLE_ID}`);
          const submissions = await api(`/v1/apps/${apps.data[0].id}/betaFeedbackCrashSubmissions?limit=20`);
          const sorted = [...submissions.data].sort((a, b) =>
            String(b.attributes.createdDate).localeCompare(String(a.attributes.createdDate)));
          console.log(`${sorted.length} crash submission(s)`);

          fs.mkdirSync('crashlogs', { recursive: true });
          for (const submission of sorted) {
            const a = submission.attributes;
            const stamp = String(a.createdDate).replace(/[:.]/g, '-');
            console.log(`${a.createdDate}  ${a.deviceModel ?? '?'}  iOS ${a.osVersion ?? '?'}  ${submission.id}`);
            fs.writeFileSync(`crashlogs/${stamp}-meta.json`, JSON.stringify(a, null, 2));
            const log = await api(`/v1/betaFeedbackCrashSubmissions/${submission.id}/crashLog`);
            const text = log.data?.attributes?.logText;
            fs.writeFileSync(`crashlogs/${stamp}.crash`, text ?? JSON.stringify(log, null, 2));
          }
          JS
          node fetch.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: testflight-crashlogs
          path: crashlogs
