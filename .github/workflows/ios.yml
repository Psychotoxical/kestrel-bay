name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = compile this branch for iOS; testflight = build the app and upload it; crashlogs = fetch TestFlight crash reports; feedback = fetch TestFlight screenshot feedback; symbols = build like testflight without uploading and resolve `offsets`"
        type: choice
        options: [check, testflight, crashlogs, feedback, symbols]
        default: check
      offsets:
        description: "symbols: comma-separated offsets from a crash or resource report (`Psysonic + N`)"
        type: string
        default: ''

concurrency:
  group: psysonic-ios-${{ inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    if: inputs.mode == 'check'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Placeholder frontend
        run: |
          mkdir -p dist
          echo '<!doctype html><title>check</title>' > dist/index.html

      - name: cargo check for iOS
        working-directory: src-tauri
        run: |
          set +e
          # Debug and release both: Psysonic has code that only exists without debug_assertions.
          cargo check --workspace --target aarch64-apple-ios --keep-going --message-format short 2>&1 | tee "$GITHUB_WORKSPACE/ios-check.log"
          dev=${PIPESTATUS[0]}
          cargo check --release --workspace --target aarch64-apple-ios --keep-going --message-format short 2>&1 | tee -a "$GITHUB_WORKSPACE/ios-check.log"
          release=${PIPESTATUS[0]}
          echo "cargo exit code: dev=$dev release=$release" | tee -a "$GITHUB_WORKSPACE/ios-check.log"

      - name: Summary
        run: |
          log=ios-check.log
          {
            echo "## psysonic-ios on aarch64-apple-ios"
            echo
            tail -n 1 "$log"
            echo
            echo "### Errors"
            grep -E "^[^ ]+\.rs:[0-9]+:[0-9]+: error" "$log" || true
            echo
            echo "### Warnings per file"
            grep -E "^[^ ]+\.rs:[0-9]+:[0-9]+: warning" "$log" | cut -d: -f1 | sort | uniq -c | sort -rn || true
            echo
            echo "### Crates that could not compile"
            grep -E "could not compile" "$log" | sort -u || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: psysonic-ios-check-log
          path: ios-check.log

  testflight:
    if: inputs.mode == 'testflight' || inputs.mode == 'symbols'
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check secrets
        run: |
          for name in APPLE_DEVELOPMENT_TEAM APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is missing"; exit 1; fi
          done

      - name: Write App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "::error::Secret APPLE_API_KEY_P8 is missing"; exit 1; fi
          mkdir -p ~/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - run: xcodebuild -version

      - run: npm ci

      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - run: npx tauri ios init --ci

      # Tauri has no iOS entitlements setting; the generated project carries an
      # entitlements file, and automatic signing picks the capability up from the App ID.
      - name: Add the CarPlay entitlement
        run: |
          f=$(find src-tauri/gen/apple -name '*_iOS.entitlements' | head -n 1)
          if [ -z "$f" ]; then echo "::error::No entitlements file in the generated project"; exit 1; fi
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.carplay-audio bool true" "$f"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.siri bool true" "$f"
          cat "$f"

      - name: Show linked SDK frameworks
        run: grep -n "sdk:" src-tauri/gen/apple/project.yml

      - run: npx tauri icon src-tauri/icons/ios-app-icon.png

      - name: Build iOS app
        env:
          # Touch shell; TAURI_ENV_PLATFORM=ios selects it too, this keeps it explicit.
          PSY_MOBILE_SHELL: '1'
        run: npx tauri ios build --ci --export-method app-store-connect --build-number ${{ github.run_number }}

      - name: Show signed entitlements
        if: inputs.mode == 'testflight'
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          rm -rf ipa-check && mkdir ipa-check && unzip -q "$ipa" -d ipa-check
          codesign -d --entitlements - ipa-check/Payload/*.app

      - name: Upload to TestFlight
        if: inputs.mode == 'testflight'
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ]; then echo "::error::No IPA found"; exit 1; fi
          echo "Uploading $ipa"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      # Report offsets are relative to the image base; the Mach-O __TEXT starts at
      # 0x100000000, so offset N resolves at 0x100000000 + N. Every Mach-O `Psysonic`
      # and dSYM the build leaves behind is tried: which of them still has symbols
      # is not known in advance.
      - name: Resolve report offsets
        if: inputs.mode == 'symbols'
        env:
          OFFSETS: ${{ inputs.offsets }}
        run: |
          set +e
          addrs=""
          for o in ${OFFSETS//,/ }; do addrs="$addrs $(printf '0x%x' $((0x100000000 + o)))"; done
          {
            echo "offsets: $OFFSETS"
            echo "addresses:$addrs"
            find src-tauri/gen/apple/build "$HOME/Library/Developer/Xcode/DerivedData" \
              \( -name Psysonic -type f -o -name '*.dSYM' -type d \) 2>/dev/null | while read -r p; do
              bin="$p"
              if [ -d "$p" ]; then bin=$(find "$p/Contents/Resources/DWARF" -type f | head -n 1); fi
              [ -f "$bin" ] || continue
              file "$bin" | grep -q Mach-O || continue
              echo
              echo "### $p"
              dwarfdump --uuid "$bin"
              echo "defined symbols: $(nm -U "$bin" 2>/dev/null | wc -l)"
              atos -o "$bin" -arch arm64 -l 0x100000000 $addrs
            done
          } 2>&1 | tee symbols.txt

      - uses: actions/upload-artifact@v7
        if: inputs.mode == 'symbols'
        with:
          name: symbols
          path: symbols.txt

  crashlogs:
    if: inputs.mode == 'crashlogs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch TestFlight crash reports
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          BUNDLE_ID: dev.psysonic.player
        run: |
          cat > fetch.mjs <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const { APPLE_API_ISSUER: iss, APPLE_API_KEY: kid, APPLE_API_KEY_P8: p8, BUNDLE_ID } = process.env;
          const b64 = (v) => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64({ alg: 'ES256', kid, typ: 'JWT' })}.${b64({ iss, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' })}`;
          const signature = crypto.sign('sha256', Buffer.from(unsigned), { key: p8, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${unsigned}.${signature}`;

          const api = async (path) => {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status} ${await response.text()}`);
            return response.json();
          };

          const apps = await api(`/v1/apps?filter[bundleId]=${BUNDLE_ID}`);
          if (!apps.data.length) throw new Error(`no app with bundle id ${BUNDLE_ID}`);
          const submissions = await api(`/v1/apps/${apps.data[0].id}/betaFeedbackCrashSubmissions?limit=20`);
          const sorted = [...submissions.data].sort((a, b) =>
            String(b.attributes.createdDate).localeCompare(String(a.attributes.createdDate)));
          console.log(`${sorted.length} crash submission(s)`);

          fs.mkdirSync('crashlogs', { recursive: true });
          for (const submission of sorted) {
            const a = submission.attributes;
            const stamp = String(a.createdDate).replace(/[:.]/g, '-');
            console.log(`${a.createdDate}  ${a.deviceModel ?? '?'}  iOS ${a.osVersion ?? '?'}  ${submission.id}`);
            fs.writeFileSync(`crashlogs/${stamp}-meta.json`, JSON.stringify(a, null, 2));
            const log = await api(`/v1/betaFeedbackCrashSubmissions/${submission.id}/crashLog`);
            const text = log.data?.attributes?.logText;
            fs.writeFileSync(`crashlogs/${stamp}.crash`, text ?? JSON.stringify(log, null, 2));
          }
          JS
          node fetch.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: testflight-crashlogs
          path: crashlogs

  feedback:
    if: inputs.mode == 'feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Public repository: the log names only dates and devices, comments and screenshots stay
      # in the short-lived artifact, and tester e-mail addresses are never written.
      - name: Fetch TestFlight screenshot feedback
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          BUNDLE_ID: dev.psysonic.player
        run: |
          cat > fetch.mjs <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const { APPLE_API_ISSUER: iss, APPLE_API_KEY: kid, APPLE_API_KEY_P8: p8, BUNDLE_ID } = process.env;
          const b64 = (v) => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64({ alg: 'ES256', kid, typ: 'JWT' })}.${b64({ iss, iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' })}`;
          const signature = crypto.sign('sha256', Buffer.from(unsigned), { key: p8, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const token = `${unsigned}.${signature}`;

          const api = async (path) => {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status} ${await response.text()}`);
            return response.json();
          };

          const apps = await api(`/v1/apps?filter[bundleId]=${BUNDLE_ID}`);
          if (!apps.data.length) throw new Error(`no app with bundle id ${BUNDLE_ID}`);
          const submissions = await api(`/v1/apps/${apps.data[0].id}/betaFeedbackScreenshotSubmissions?limit=50`);
          const sorted = [...submissions.data].sort((a, b) =>
            String(b.attributes.createdDate).localeCompare(String(a.attributes.createdDate)));
          console.log(`${sorted.length} screenshot submission(s)`);

          fs.mkdirSync('feedback', { recursive: true });
          const summary = [];
          for (const submission of sorted) {
            const { email, screenshots = [], ...a } = submission.attributes;
            const stamp = String(a.createdDate).replace(/[:.]/g, '-');
            let build = null;
            try {
              const b = await api(`/v1/betaFeedbackScreenshotSubmissions/${submission.id}/build?fields[builds]=version`);
              build = b.data?.attributes?.version ?? null;
            } catch (error) {
              console.log(`build lookup failed for ${submission.id}: ${error.message.split('\n')[0]}`);
            }
            console.log(`${a.createdDate}  build ${build ?? '?'}  ${a.deviceModel ?? '?'}  iOS ${a.osVersion ?? '?'}  ${screenshots.length} image(s)`);
            const files = [];
            for (const [i, shot] of screenshots.entries()) {
              const response = await fetch(shot.url);
              if (!response.ok) { console.log(`image ${i + 1}: HTTP ${response.status}`); continue; }
              const type = response.headers.get('content-type') ?? '';
              const ext = type.includes('png') ? 'png' : 'jpg';
              const file = `${stamp}-${i + 1}.${ext}`;
              fs.writeFileSync(`feedback/${file}`, Buffer.from(await response.arrayBuffer()));
              files.push(file);
            }
            fs.writeFileSync(`feedback/${stamp}-meta.json`, JSON.stringify({ id: submission.id, build, ...a, files }, null, 2));
            summary.push(`## ${a.createdDate} · build ${build ?? '?'} · ${a.deviceModel ?? '?'} · iOS ${a.osVersion ?? '?'}\n\n${a.comment || '(no comment)'}\n\n${files.map(f => `- ${f}`).join('\n')}\n`);
          }
          fs.writeFileSync('feedback/summary.md', summary.join('\n'));
          JS
          node fetch.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: testflight-feedback
          path: feedback
          retention-days: 1
