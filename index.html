<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kestrel Bay</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main>
      <h1>Kestrel Bay</h1>
      <p id="status">Bereit.</p>

      <div class="buttons">
        <button id="start" type="button">Test starten</button>
        <button id="stop" type="button">Stopp</button>
      </div>

      <p class="hint">
        Starten, iPhone sperren, zuhören. Ton 1 piept einmal, Ton 2 zweimal, Ton 3 dreimal.
        Nach dem Entsperren steht unten, was wann passiert ist.
      </p>

      <h2>Herzschlag der Oberfläche</h2>
      <p id="heartbeat">–</p>

      <h2>Ablauf</h2>
      <button id="refresh" type="button" class="small">Aktualisieren</button>
      <ol id="log"></ol>
    </main>
  </body>
</html>
